[project]
name = "pgmol-bench"
version = "0.1.0"
description = "Standardized benchmark suite for LLM APIs and headless coding agents on pgmol"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
pgmol-bench = "benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
